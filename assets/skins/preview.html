<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同屏 Ping · 皮肤预览</title><style>@font-face{font-family:WenKai;src:url('../fonts/LXGWWenKaiLite-Regular.ttf')}*{box-sizing:border-box}body{margin:0;padding:24px 16px;background:#f6efe3 url('../thread/tp-09-cream-linen-light.png');color:#49343e;font-family:WenKai,system-ui,sans-serif}main{max-width:760px;margin:auto}h1{font-size:24px}.preview{padding:20px;border:1px dashed #b88b9b;border-radius:20px;text-align:center;overflow:hidden}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pair img{display:block;width:100%;height:auto;aspect-ratio:240/76}.frame{width:56px;height:56px;object-fit:contain}h2{margin:12px 0;font-size:20px}.picker{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:18px 0}.picker button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 4px;background:transparent;border:1px dashed #b88b9b;border-radius:14px;font:inherit;color:inherit;cursor:pointer}.picker button[aria-pressed=true]{box-shadow:inset 0 0 0 2px #b74868}.picker img{width:100%;height:auto}footer{font-size:12px}a{color:#95506b}@media(max-width:480px){.picker{grid-template-columns:repeat(3,minmax(0,1fr))}.pair{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){.moving{display:none}}</style><main><h1>轨迹与头像框 · 皮肤预览</h1><div class="preview" id="preview" aria-live="polite"></div><div class="picker"><button type="button" data-skin="rose" aria-pressed="false"><img alt="" src="rose-static.svg"><span>粉线缝迹</span></button><button type="button" data-skin="sea" aria-pressed="false"><img alt="" src="sea-static.svg"><span>海盐泡泡</span></button><button type="button" data-skin="mint" aria-pressed="false"><img alt="" src="mint-static.svg"><span>薄荷叶语</span></button><button type="button" data-skin="star" aria-pressed="false"><img alt="" src="star-static.svg"><span>星光绣带</span></button><button type="button" data-skin="cloud" aria-pressed="false"><img alt="" src="cloud-static.svg"><span>奶油云朵</span></button></div><footer>路线为示例。复用 <a href="https://github.com/rubenspgcavalcante/leaflet-ant-path">Leaflet Ant Path</a> SVG 描边（MIT）。</footer></main><script>const skins=[{"id":"rose","name":"粉线缝迹","frame":"蝴蝶结绣圈"},{"id":"sea","name":"海盐泡泡","frame":"蓝色贝壳边"},{"id":"mint","name":"薄荷叶语","frame":"叶片花环"},{"id":"star","name":"星光绣带","frame":"月夜星绣"},{"id":"cloud","name":"奶油云朵","frame":"奶油云边"}];function select(id){const s=skins.find(s=>s.id===id);document.getElementById('preview').innerHTML='<img class="frame" alt="'+s.frame+'" src="'+(s.id==='rose'?'../thread/tp-06-me-ring-light.png':'frame-'+s.id+'.svg')+'"><div class="pair"><div><img alt="静态路线" src="'+s.id+'-static.svg"></div><div class="moving"><img alt="移动效果" src="'+s.id+'-motion.svg"></div></div><h2>'+s.name+'</h2>';document.querySelectorAll('[data-skin]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.skin===id)))}document.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>select(b.dataset.skin));select('rose');</script></html>
