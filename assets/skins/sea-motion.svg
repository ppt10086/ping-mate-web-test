<svg xmlns="http://www.w3.org/2000/svg" width="240" height="76" viewBox="0 0 240 76" role="img" aria-label="海盐泡泡实时点边移动边绘制轨迹" data-trail-skin="sea" class="skin-preview is-moving"><style>.thread-trail-flow,.skin-preview{--flow-start:30;--flow-distance:180;--flow-duration:3.6s}
[data-trail-skin="sea"]{--flow-start:23.04;--flow-distance:192;--flow-duration:5s}
[data-trail-skin="mint"]{--flow-start:24;--flow-distance:192;--flow-duration:4.8s}
[data-trail-skin="star"]{--flow-start:18.6;--flow-distance:186;--flow-duration:6s}
[data-trail-skin="cloud"]{--flow-start:15.428571;--flow-distance:180;--flow-duration:7s}
.thread-trail-flow,.is-moving .preview-flow{animation:threadTrailStart 1.2s cubic-bezier(.333333,0,.666667,.333333) both,threadTrailFlow var(--flow-duration) linear 1.2s infinite;pointer-events:none}
.preview-traveler{pointer-events:none}
@keyframes threadTrailFlow{from{stroke-dashoffset:calc(-1 * var(--flow-start))}to{stroke-dashoffset:calc(-1 * (var(--flow-start) + var(--flow-distance)))}}
@keyframes threadTrailStart{from{stroke-dashoffset:0}to{stroke-dashoffset:calc(-1 * var(--flow-start))}}
#page-settings[hidden] .skin-preview *{animation-play-state:paused}

@media(prefers-reduced-motion:reduce){.thread-trail-flow,.is-moving .preview-flow{animation:none!important}.preview-traveler{display:none}.preview-reveal{stroke-dashoffset:0!important}}</style><defs><pattern id="preview-weave-sea-moving" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 1h4M1 0v4" fill="none" stroke="#fff7eb" stroke-width=".6" opacity=".28"/></pattern><mask id="draw-sea-moving" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="76"><path class="preview-reveal" d="M14 50C50 50 40 24 84 29S128 57 155 34S200 21 226 24" pathLength="1" fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-dasharray="1 1"><animate attributeName="stroke-dashoffset" values="1;1;.888889;0;0" keyTimes="0;.08;.264;.9;1" keySplines="0 0 1 1;.333333 0 .666667 .333333;0 0 1 1;0 0 1 1" calcMode="spline" dur="6s" repeatCount="indefinite"/></path></mask></defs><g><animate attributeName="opacity" values="1;1;0" keyTimes="0;.95;1" dur="6s" repeatCount="indefinite"/><g mask="url(#draw-sea-moving)"><path d="M14 50C50 50 40 24 84 29S128 57 155 34S200 21 226 24" fill="none" stroke="#659bb2" stroke-width="6.5" stroke-linecap="round"/><path d="M14 50C50 50 40 24 84 29S128 57 155 34S200 21 226 24" fill="none" stroke="url(#preview-weave-sea-moving)" stroke-width="6.5" stroke-linecap="round"/><path class="preview-flow" d="M14 50C50 50 40 24 84 29S128 57 155 34S200 21 226 24" fill="none" stroke="#effbff" stroke-width="1.3" opacity=".55" stroke-dasharray="1 23" stroke-linecap="round"/></g><g class="preview-traveler"><circle r="9" fill="#dce9e6" stroke="#659bb2" stroke-width="1"/><circle r="5.5" fill="#effbff" stroke="#659bb2" stroke-width="1.5" stroke-dasharray="2 2"/><animateMotion path="M14 50C50 50 40 24 84 29S128 57 155 34S200 21 226 24" dur="6s" repeatCount="indefinite" calcMode="spline" keyPoints="0;0;.111111;1;1" keyTimes="0;.08;.264;.9;1" keySplines="0 0 1 1;.333333 0 .666667 .333333;0 0 1 1;0 0 1 1"/></g></g></svg>