<svg xmlns="http://www.w3.org/2000/svg" width="240" height="76" viewBox="0 0 240 76" role="img" aria-label="玫瑰星绣静态路线" data-trail-skin="star" class="skin-preview "><style>.thread-trail-flow,.skin-preview{--flow-start:30px;--flow-distance:180px;--flow-duration:3.6s}
[data-trail-skin="sea"]{--flow-start:23.04px;--flow-distance:192px;--flow-duration:5s}
[data-trail-skin="mint"]{--flow-start:24px;--flow-distance:192px;--flow-duration:4.8s}
[data-trail-skin="star"]{--flow-start:18.6px;--flow-distance:186px;--flow-duration:6s}
[data-trail-skin="cloud"]{--flow-start:15.428571px;--flow-distance:180px;--flow-duration:7s}
.thread-trail-flow{animation:threadTrailStart 1.2s cubic-bezier(.333333,0,.666667,.333333) both,threadTrailFlow var(--flow-duration) linear 1.2s infinite;pointer-events:none}
.preview-traveler{pointer-events:none}
@keyframes threadTrailFlow{from{stroke-dashoffset:calc(-1 * var(--flow-start))}to{stroke-dashoffset:calc(-1 * (var(--flow-start) + var(--flow-distance)))}}
@keyframes threadTrailStart{from{stroke-dashoffset:0}to{stroke-dashoffset:calc(-1 * var(--flow-start))}}
#page-settings[hidden] .skin-preview *{animation-play-state:paused}

@media(prefers-reduced-motion:reduce){.thread-trail-flow,.is-moving .preview-flow{animation:none!important}.preview-traveler{display:none}.preview-reveal{stroke-dashoffset:0!important}}</style><defs><pattern id="preview-weave-star-still" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 1h4M1 0v4" fill="none" stroke="#fff7eb" stroke-width=".6" opacity=".28"/></pattern></defs><g><g><path d="M14 50C50 50 40 24 84 29S128 57 155 34S200 21 226 24" fill="none" stroke="#935878" stroke-width="6.5" stroke-linecap="round"/><path d="M14 50C50 50 40 24 84 29S128 57 155 34S200 21 226 24" fill="none" stroke="url(#preview-weave-star-still)" stroke-width="6.5" stroke-linecap="round"/><path class="preview-flow" d="M14 50C50 50 40 24 84 29S128 57 155 34S200 21 226 24" fill="none" stroke="#fff2f7" stroke-width="1.3" opacity=".55" stroke-dasharray="2 29" stroke-linecap="round"></path></g></g></svg>